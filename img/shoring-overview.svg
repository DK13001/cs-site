<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
<title id="title">시스템 동바리 구성 개념도</title>
<desc id="desc">정면에서 본 시스템 동바리. 콘크리트 아래에 합판, 장선, 멍에, 상부 조절잭, 수직재가 순서대로 배치되고 수평재와 가새재가 연결된다. 하부 조절잭과 받침판은 받침목 위에 놓인다. 특정 현장의 설치 상세나 설계 치수를 나타내지 않는다.</desc>
